<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Playwright Academy</title>
  <meta name="description" content="TypeScript + Playwright for Selenium folks, explained like you're five. Works offline, in 5 languages.">
  <meta name="theme-color" content="#0B1437">
  <meta name="color-scheme" content="light dark">

  <!-- iOS: run full-screen from the home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PW Academy">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      var mode = 0;
      try { mode = JSON.parse(localStorage.getItem('pa.theme')) || 0; } catch (e) {}
      var dark = mode === 2 || (mode === 0 && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <noscript><p style="padding:24px">Playwright Academy needs JavaScript to run.</p></noscript>
  <script src="app.js" defer></script>
</body>
</html>
